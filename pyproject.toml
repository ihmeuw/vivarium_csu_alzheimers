[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-csu-alzheimers"
description = "Vivarium simulation model for the vivarium_csu_alzheimers project."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
# This model is no longer under active development. Its vivarium packages are pinned
# to the versions that resolved when it was frozen (MIC-7783), so new releases cannot
# change or break its environment. Re-run the model before loosening these pins.
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]==1.3.1",
    "vivarium-build-utils==4.14.2",
    "vivarium-engine==6.0.2",
    "vivarium-public-health==6.8.1",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
test = ["vivarium-dependencies[pytest]==1.3.1", "pytest-vivarium==0.3.1"]
cluster = ["vivarium-cluster-tools[cluster]==4.10.0"]
interactive = ["vivarium-dependencies[interactive]==1.3.1", "vivarium-interactive==1.0.1"]
lint = ["vivarium-dependencies[lint]==1.3.1"]
data = [
    "vivarium-inputs==9.1.3",
    "vivarium-gbd-access==7.0.1",
    "vivarium-gbd-mapping==6.0.7",
    "xarray",
    # Required by vivarium_csu_alzheimers.data.forecasts
    "netcdf4",
    # Required by vivarium_csu_alzheimers.data.consistent_rates
    # jax >=0.7.2 requires numpy>=2.0, which conflicts with the GBD
    # shared-function stack's numpy<2 pin. Constrain jax so uv backtracks the
    # whole jax stack to a numpy-1-compatible set rather than overriding it.
    "jax<0.7.2",
    "numpyro",
    "diffrax",
    "interpax",
    "vivarium-csu-alzheimers[cluster]",
]
dev = ["vivarium-csu-alzheimers[interactive,test,cluster,lint]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_csu_alzheimers"

[project.scripts]
make_artifacts = "vivarium_csu_alzheimers.tools.cli:make_artifacts"

[tool.uv]
# pyarrow 26 needs numpy 2 but does not declare it, so cap it while numpy<2 is here.
# This model stays on the pre-MIC-7613 GBD stack (vivarium-gbd-access 7), so these
# overrides stay too.
override-dependencies = ["pandas<3.0.0", "sqlalchemy>=2.0.0,<3.0.0", "numpy<2.0.0", "pyarrow<26.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = '^(?P<prefix>v)?(?P<version>[^\+]+)(?P<suffix>.*)?$'

# Only use version-like tags (v1.2.3 or 1.2.3) for the package version so that
# other tags (for example, model13.0) do not break the build.
[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*", "--match", "[0-9]*"]

[tool.black]
line_length = 94

[tool.isort]
profile = "black"
